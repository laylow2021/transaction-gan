[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transaction-gan"
version = "0.1.0"
description = "Synthetic transaction data generation pipeline powered by SDV's CTGAN"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.7",
  "PySide6>=6.7",
  "sdv>=1.12",
  "torch>=2.5",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
