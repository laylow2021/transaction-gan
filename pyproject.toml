[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transaction-gan"
version = "0.1.0"
description = "Synthetic transaction data generation pipeline using a pure Python GAN"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.7",
  "streamlit>=1.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
